          pour couvrir le clickjacking. Cf /app/memory/security_headers.md.
        -->

        <script>
          // Anti-clickjacking de transition (M1-F) : en cadre d'une autre origine → rien n'est rendu, on sort du cadre.

        </script>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script>

          // est géré côté React (composant UpdateBanner) et déclenche SKIP_WAITING
          // sur clic explicite pour ne pas interrompre une saisie.
          if ("serviceWorker" in navigator && !(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform())) {
            window.addEventListener("load", function() {
              navigator.serviceWorker.register("/sw.js").catch(function(err) {
                console.warn("SW registration failed:", err);
              });
            });
          }
        </script>
        <script>
          // Script d'édition visuelle Emergent — chargé uniquement en preview,
          // jamais dans un déploiement production. Détecté au runtime.
          (function(){
            try {
              var h = window.location.hostname || "";
              if (h.indexOf("preview.emergentagent.com") !== -1 || h === "localhost" || h === "127.0.0.1") {

                s.async = true;
                document.head.appendChild(s);
              }
            } catch (e) { /* silencieux */ }
          })();
