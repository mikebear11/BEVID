crons:
  - name: payment-reminders
    description: "Envoie relances J+15 et J+30 pour les impayés (WhatsApp/SMS) via Twilio"
    cron: "0 9 * * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/payment-reminders"
    method: POST
    enabled: true
  - name: deviation-alerts
    description: "Calcule chaque lundi les écarts fréquence/volume et génère les alertes"
    cron: "0 6 * * 1"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/deviation-alerts"
    method: POST
    enabled: true
  - name: bad-payer-scan
    description: "Scan quotidien des mauvais payeurs contre les seuils configurés"
    cron: "0 7 * * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/bad-payer-scan"
    method: POST
    enabled: true
  - name: voice-purge
    description: "Purge les transcriptions vocales au-delà de la rétention (RGPD)"
    cron: "30 3 * * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/voice-purge"
    method: POST
    enabled: true
  - name: bouclier-encours
    description: "Scan quotidien BODACC des procédures collectives sur les SIREN clients"
    cron: "0 5 * * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/bouclier/scan"
    method: POST
    enabled: true
  - name: radar-ouvertures
    description: "Scan quotidien BODACC des créations CHR sur les départements surveillés + enrichissement"
    cron: "30 6 * * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/radar/creations"
    method: POST
    enabled: true
  - name: rappels-conso
    description: "Veille horaire RappelConso par GTIN sur notre catalogue"
    cron: "5 * * * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/rappels/scan"
    method: POST
    enabled: true
  - name: enrichissement-sirene-refresh
    description: "Rafraîchit mensuellement l'identité Sirene (Couche A) sur tout le portefeuille — respecte les verrous utilisateur"
    cron: "0 3 1 * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/enrichissement/sirene-refresh"
    method: POST
    enabled: true
  - name: enrichissement-scoring-mensuel
    description: "Scoring mensuel via le port anonymisé (Couche B) sur tout le portefeuille. Bascule Couche A si crédits épuisés."
    cron: "0 4 1 * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/enrichissement/scoring-mensuel"
    method: POST
    enabled: true
  - name: enrichissement-comptes-annuels-rne
    description: "Chargement annuel des comptes annuels et dirigeants depuis le RNE INPI (avril)"
    cron: "0 5 15 4 *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/enrichissement/comptes-annuels-rne"
    method: POST
    enabled: true
  - name: notifications-flush
    description: "Flush des notifications différées quand la plage silence se termine (toutes les 30 min)"
    cron: "*/30 * * * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/notifications-flush"
    method: POST
    enabled: true
  - name: digest-morning
    description: "Résumé matin 8h : activité sur mes objets depuis 14h la veille"
    cron: "0 8 * * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/digest-morning"
    method: POST
    enabled: true
  - name: digest-afternoon
    description: "Résumé après-midi 14h : activité sur mes objets depuis 8h ce matin"
    cron: "0 14 * * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/digest-afternoon"
    method: POST
    enabled: true
  - name: approval-reminders
    description: "Rappel manager si une demande de validation est pending depuis plus de 24h"
    cron: "0 9,15 * * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/approval-reminders"
    method: POST
    enabled: true
  - name: weekly-review-monday
    description: "Compose un brouillon de revue hebdo pour chaque commercial le lundi à 7h"
    cron: "0 7 * * 1"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/weekly-review-monday"
    method: POST
    enabled: true
