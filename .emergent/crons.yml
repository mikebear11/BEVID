crons:
  - name: payment-reminders
    description: "Envoie relances J+15 et J+30 pour les impayés (WhatsApp/SMS) via Twilio"
    cron: "0 9 * * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/payment-reminders"
    method: POST
    enabled: true
  - name: deviation-alerts
    description: "Calcule chaque lundi les écarts fréquence/volume et génère les alertes"
    cron: "0 6 * * 1"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/deviation-alerts"
    method: POST
    enabled: true
  - name: bad-payer-scan
    description: "Scan quotidien des mauvais payeurs contre les seuils configurés"
    cron: "0 7 * * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/bad-payer-scan"
    method: POST
    enabled: true
  - name: voice-purge
    description: "Purge les transcriptions vocales au-delà de la rétention (RGPD)"
    cron: "30 3 * * *"
    timezone: "Europe/Paris"
    endpoint: "{{BASE_URL}}/api/cron/voice-purge"
    method: POST
    enabled: true
